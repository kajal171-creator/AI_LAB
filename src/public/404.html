<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>404 - Oops!</title>
    <style>
      body {
        background: #0f172a;
        color: #f1f5f9;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        overflow: hidden;
      }
      h1 {
        font-size: 5rem;
        color: #ef4444;
        margin-bottom: 1rem;
      }
      p {
        font-size: 1.5rem;
        color: #94a3b8;
      }
      .bot {
        font-size: 4rem;
        animation: shake 1s infinite;
      }
      @keyframes shake {
        0% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(3deg);
        }
        50% {
          transform: rotate(-3deg);
        }
        75% {
          transform: rotate(3deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="bot">🤖</div>
    <h1>404</h1>
    <p>Oops! Even AI couldn't find that page!</p>
  </body>
</html>
